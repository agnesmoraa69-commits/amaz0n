<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amaz0n - Storefront</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #fff; 
            color: #0f1111; 
        }
        
        /* Header & Navigation */
        .amz-header { 
            background: #232f3e; 
            padding: 10px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            color: white; 
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }
        
        /* Search */
        .search-container { display: flex; padding: 10px; background: #232f3e; }
        .search-input { 
            flex-grow: 1; padding: 12px; border: none; border-radius: 4px 0 0 4px; font-size: 16px;
        }
        .search-btn { 
            background: #febd69; border: none; padding: 0 15px; border-radius: 0 4px 4px 0; font-size: 18px; cursor: pointer;
        }
        
        .deliver-banner { background: #37475a; color: white; padding: 10px 15px; font-size: 14px; }

        /* Store Header */
        .store-nav {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 15px;
            border-bottom: 1px solid #ddd; position: sticky; top: 0; background: #fff; z-index: 10;
        }
        .store-nav-search { display: flex; align-items: center; flex: 1; margin-left: 10px; margin-right: 15px; }
        .store-nav-search input { width: 100%; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        .follow-btn {
            background: #f0f2f2; border: 1px solid #d5d9d9; border-radius: 20px;
            padding: 5px 15px; font-size: 14px; font-weight: 600;
        }
        
        /* Layout Containers */
        #main-storefront { display: block; }
        #search-results-page { display: none; padding: 15px; min-height: 80vh; }
        .loading-spinner { text-align: center; padding: 50px; font-style: italic; color: #565959; display: none; }

        .brand-hero { text-align: center; padding: 20px 0; }
        .brand-hero h1 { font-family: serif; font-size: 32px; letter-spacing: 2px; margin-bottom: 5px; }
        .brand-hero p { font-style: italic; font-size: 14px; color: #555; }
        .hero-img { width: 100%; height: 350px; object-fit: cover; display: block; }

        .section-title { text-align: center; font-size: 18px; margin: 25px 0 15px; font-weight: normal; }

        /* Product Feed */
        .product-feed { padding: 15px 10px; }
        .product-card { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 20px 0; gap: 15px; }
        .product-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .product-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; text-transform: capitalize; }
        .product-color { font-size: 13px; color: #565959; margin-bottom: 6px; font-weight: 500; }
        
        .price-block { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .discount-badge { background: #cc0c39; color: white; padding: 2px 6px; font-size: 12px; font-weight: bold; border-radius: 2px; }
        .new-price { font-size: 20px; font-weight: 700; }
        .old-price { font-size: 14px; color: #565959; text-decoration: line-through; }
        
        .product-img-box { width: 130px; height: 160px; position: relative; flex-shrink: 0; background: #f8f8f8; border-radius: 4px; overflow: hidden; }
        .product-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Action Buttons */
        .action-buttons { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 200px; }
        
        .btn-action {
            padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; text-align: center; width: 100%;
        }
        .btn-cart { background: #ffd814; border-color: #fcd200; }
        .btn-buy { background: #ffa41c; border-color: #ff8f00; }

        .back-btn { margin-top: 20px; padding: 10px 20px; border: 1px solid #d5d9d9; background: #f0f2f2; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header class="amz-header">
        <div class="header-left">
            <span>☰</span>
            <span class="logo">amaz0n</span>
        </div>
        <div>Sign in › 👤 🛒 <span id="cart-count">0</span></div>
    </header>

    <!-- Header Search -->
    <div class="search-container">
        <input type="text" id="main-search-input" class="search-input" placeholder="Search clothes, outfits, trends..." onkeypress="handleEnter(event, 'main-search-input')">
        <button class="search-btn" onclick="executeSearch('main-search-input')">🔍</button>
    </div>

    <div class="deliver-banner">📍 Deliver to Kenya ∨</div>

    <!-- Search Results Container -->
    <div id="loading-state" class="loading-spinner">Searching collection...</div>
    <div id="search-results-page"></div>

    <!-- Default Storefront Container -->
    <div id="main-storefront">
        <div class="store-nav">
            <span>≡</span>
            <div class="store-nav-search">
                <input type="text" id="nav-search-input" placeholder="Search store..." onkeypress="handleEnter(event, 'nav-search-input')">
            </div>
            <button class="follow-btn">Follow</button>
        </div>

        <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1200&auto=format&fit=crop" class="hero-img" alt="Hero">

        <h3 class="section-title">Shop The Look</h3>

        <div class="product-feed">
            <div class="product-card">
                <div class="product-info">
                    <div class="product-title">Wide Leg Corduroy Trousers</div>
                    <div class="product-color">Color: Olive Green</div>
                    <div class="price-block">
                        <span class="discount-badge">-45%</span>
                        <span class="new-price">$13.75</span>
                        <span class="old-price">$25.00</span>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-action btn-cart" onclick="triggerAction(this, 'Added ✓')">Add to cart</button>
                        <button class="btn-action btn-buy" onclick="triggerAction(this, 'Processing...')">Buy Now</button>
                    </div>
                </div>
                <div class="product-img-box">
                    <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=400&auto=format&fit=crop" alt="Corduroy Pants">
                </div>
            </div>
        </div>
    </div>

    <script>
        let count = 0;

        // Curated photography dictionary for trousers/pants categories
        const apparelCatalog = [
            {
                color: "Olive Green",
                priceDiff: 0.00,
                img: "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600&auto=format&fit=crop"
            },
            {
                color: "Espresso Brown",
                priceDiff: 1.20,
                img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=600&auto=format&fit=crop"
            },
            {
                color: "Midnight Black",
                priceDiff: 2.10,
                img: "https://images.unsplash.com/photo-1551854838-212c50b4c184?w=600&auto=format&fit=crop"
            },
            {
                color: "Cream White",
                priceDiff: 0.85,
                img: "https://images.unsplash.com/photo-1584370848010-d7fe6bc767ec?w=600&auto=format&fit=crop"
            },
            {
                color: "Rustic Wine",
                priceDiff: 1.50,
                img: "https://images.unsplash.com/photo-1506629082955-511b1aa562c8?w=600&auto=format&fit=crop"
            }
        ];

        function triggerAction(btn, successText) {
            const originalText = btn.innerText;
            const originalColor = btn.style.backgroundColor;
            
            if(originalText === 'Add to cart') {
                count++;
                document.getElementById('cart-count').innerText = count;
            }
            
            btn.innerText = successText;
            btn.style.backgroundColor = '#e3c01c';
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = originalColor;
            }, 2000);
        }

        function handleEnter(e, inputId) {
            if (e.key === 'Enter') {
                executeSearch(inputId);
            }
        }

        function executeSearch(inputId) {
            const query = document.getElementById(inputId).value.trim();
            if (!query) return;

            document.getElementById('main-storefront').style.display = 'none';
            document.getElementById('search-results-page').style.display = 'none';
            document.getElementById('loading-state').style.display = 'block';

            setTimeout(() => {
                renderSearchResults(query);
            }, 300);
        }

        function renderSearchResults(query) {
            document.getElementById('loading-state').style.display = 'none';
            const resultsContainer = document.getElementById('search-results-page');
            resultsContainer.style.display = 'block';

            const baseMarketPrice = 28.00;

            let cardsHtml = apparelCatalog.map(item => {
                const itemMarketPrice = (baseMarketPrice + item.priceDiff).toFixed(2);
                const itemSalePrice = ((baseMarketPrice + item.priceDiff) * 0.55).toFixed(2); // 45% discount

                return `
                    <div class="product-card">
                        <div class="product-info">
                            <div class="product-title">${query}</div>
                            <div class="product-color">Color: ${item.color}</div>
                            <div class="price-block">
                                <span class="discount-badge">-45%</span>
                                <span class="new-price">$${itemSalePrice}</span>
                                <span class="old-price">$${itemMarketPrice}</span>
                            </div>
                            <div class="action-buttons">
                                <button class="btn-action btn-cart" onclick="triggerAction(this, 'Added ✓')">Add to cart</button>
                                <button class="btn-action btn-buy" onclick="triggerAction(this, 'Processing...')">Buy Now</button>
                            </div>
                        </div>
                        <div class="product-img-box">
                            <img src="${item.img}" alt="${query} - ${item.color}">
                        </div>
                    </div>
                `;
            }).join('');

            resultsContainer.innerHTML = `
                <h2 style="font-size: 18px; margin-bottom: 15px;">Results for "${query}"</h2>
                <div class="product-feed" style="padding: 0;">
                    ${cardsHtml}
                </div>
                <div style="text-align: center; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                    <button class="back-btn" onclick="resetSearch()">← Back to Storefront</button>
                </div>
            `;
        }

        function resetSearch() {
            document.getElementById('main-search-input').value = '';
            if(document.getElementById('nav-search-input')) {
                document.getElementById('nav-search-input').value = '';
            }
            document.getElementById('search-results-page').style.display = 'none';
            document.getElementById('main-storefront').style.display = 'block';
        }
    </script>
</body>
</html>
